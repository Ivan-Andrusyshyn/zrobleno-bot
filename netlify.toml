# Netlify: один сайт = лендінг (Angular) + API бота (функції)
[build]
  command = "npm ci && npm --prefix landing ci && npm --prefix landing run build"
  publish = "landing/dist/landing/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongodb"]

# API бота: /api/tg, /api/participants, /api/setup → функції
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Angular-маршрути (/p/5 тощо) → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
